
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      FRAUD_DATABASE_PATH: /app/runtime/fraud_monitoring.db
      PYTHONPATH: /app
    volumes:
      - fraud_database:/app/runtime
      - fraud_logs:/app/logs
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-dashboard
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      FRAUD_API_URL: http://api:8000
      FRAUD_DATABASE_PATH: /app/runtime/fraud_monitoring.db
      PYTHONPATH: /app
    volumes:
      - fraud_database:/app/runtime
    depends_on:
      - api
    restart: unless-stopped

volumes:
  fraud_database:
  fraud_logs:
